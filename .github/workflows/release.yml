name: Build & Release APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'نسخه برنامه (مثال: 2.1.9)'
        required: true
        default: '2.1.9'
      version_code:
        description: 'کد نسخه (عدد صحیح، مثال: 15)'
        required: true
        default: '15'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Stamp version from workflow input
        run: |
          VN="${{ github.event.inputs.version_name }}"
          VC="${{ github.event.inputs.version_code }}"
          sed -i "s/versionCode .*/versionCode $VC/" app/build.gradle
          sed -i "s/versionName .*/versionName \"$VN\"/" app/build.gradle
          echo "VERSION_NAME=$VN" >> $GITHUB_ENV
          echo "VERSION_CODE=$VC" >> $GITHUB_ENV

      - name: Decode signing keystore
        env:
          KS_B64: ${{ secrets.KS_B64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
          KS_ALIAS: ${{ secrets.KS_ALIAS }}
          KS_KEY_PASS: ${{ secrets.KS_KEY_PASS }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::warning::secrets امضا تنظیم نشده — با کلید debug ساخته می‌شود"
            # generate a temporary keystore
            keytool -genkeypair -v -keystore app/keystore.jks -alias key \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android123 -keypass android123 -dname "CN=144Hz"
            echo "KS_PASS=android123" >> $GITHUB_ENV
            echo "KS_ALIAS=key" >> $GITHUB_ENV
            echo "KS_KEY_PASS=android123" >> $GITHUB_ENV
          else
            echo "$KS_B64" | base64 -d > app/keystore.jks
          fi

      - name: Build release APK
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/144Hz-${{ env.VERSION_NAME }}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: "نسخه ${{ env.VERSION_NAME }}"
          body: "بیلد خودکار از workflow — نسخه ${{ env.VERSION_NAME }} (code ${{ env.VERSION_CODE }})"
          files: out/144Hz-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
